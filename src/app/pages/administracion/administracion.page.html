<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Administración</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" id="main-content">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Administración</ion-title>
    </ion-toolbar>
  </ion-header>
  <br>
  <ion-title>Estadísticas</ion-title>
  <br>
  <ion-item>
    <ion-label>🟢 Usuarios activos (últimos 30 min): {{ usuariosActivos }}</ion-label>
  </ion-item>
  <ion-item>
    <ion-label>Total de usuarios registrados: {{ totalUsuarios }}</ion-label>
  </ion-item>

  <ion-item>
    <ion-label>Total de productos en inventario: {{ totalProductos }}</ion-label>
  </ion-item>
  
  <ion-card>
    <ion-card-header>
      <ion-card-title>Países principales</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list>
        <ion-item *ngFor="let pais of paisesActivos">
          <ion-label>{{ pais.nombre }} — {{ pais.usuarios }} usuarios</ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>
</ion-content>
